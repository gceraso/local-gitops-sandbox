apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: appprojects
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ${GITEA_INTERNAL_URL}
    targetRevision: main
    path: projects
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
