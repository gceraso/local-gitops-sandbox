apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitea
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: local
            url: https://kubernetes.default.svc
  template:
    metadata:
      name: gitea
    spec:
      project: orchestration
      source:
        repoURL: https://dl.gitea.com/charts/
        chart: gitea
        targetRevision: 10.6.0
        helm:
          releaseName: gitea
          values: |
            replicaCount: 1
            image:
              rootless: true
            service:
              http:
                type: ClusterIP
                port: 3000
              ssh:
                type: ClusterIP
                port: 22
            ingress:
              enabled: true
              className: traefik
              hosts:
                - host: gitea.test
                  paths:
                    - path: /
                      pathType: Prefix
            persistence:
              enabled: false
            gitea:
              admin:
                username: gitea_admin
                password: localdev123
                email: admin@local.dev
              config:
                server:
                  DOMAIN: gitea.test
                  ROOT_URL: http://gitea.test
                  HTTP_PORT: 3000
                  DISABLE_SSH: false
                  SSH_PORT: 22
                  LFS_START_SERVER: false
                database:
                  DB_TYPE: sqlite3
                session:
                  PROVIDER: memory
                cache:
                  ADAPTER: memory
                queue:
                  TYPE: level
                service:
                  DISABLE_REGISTRATION: false
                  REQUIRE_SIGNIN_VIEW: false
                  DEFAULT_ALLOW_CREATE_ORGANIZATION: true
                repository:
                  DEFAULT_BRANCH: main
                webhook:
                  ALLOWED_HOST_LIST: "*"
                mirror:
                  ENABLED: true
                  DEFAULT_INTERVAL: 5m
            postgresql:
              enabled: false
            postgresql-ha:
              enabled: false
            redis-cluster:
              enabled: false
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
      destination:
        server: "{{url}}"
        namespace: gitea
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
