apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-svc
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - cluster: local
        url: https://kubernetes.default.svc
  template:
    metadata:
      name: 'cluster-svc-{{cluster}}'
    spec:
      project: default
      source:
        repoURL: '${GITEA_INTERNAL_URL}'
        path: 'charts/cluster-svc/overlays/{{cluster}}'
        targetRevision: main
      destination:
        server: '{{url}}'
        namespace: cluster-svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
