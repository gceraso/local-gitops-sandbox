apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://kedacore.github.io/charts'
    chart: keda
    targetRevision: 2.20.2
    helm:
      values: |
        resources:
          operator:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          metricServer:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The KEDA CRDs exceed the annotation size limit that client-side apply
      # uses to store its last-applied state.
      - ServerSideApply=true
