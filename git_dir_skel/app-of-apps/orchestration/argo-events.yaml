apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-events
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://argoproj.github.io/argo-helm'
    chart: argo-events
    targetRevision: 2.4.9
    helm:
      parameters:
        - name: webhook.enabled
          value: 'true'
        - name: configs.jetstream.settings.maxFileStore
          value: '20G'
        - name: configs.jetstream.settings.maxMemoryStore
          value: '1G'
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-events
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
