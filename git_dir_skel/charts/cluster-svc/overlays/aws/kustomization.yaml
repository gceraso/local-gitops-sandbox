apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything the base has, plus resources that require real AWS: Karpenter
# EC2NodeClasses and NodePools. Nothing syncs this overlay locally - its CRDs
# are not installed - but `kustomize build` still validates it, which is the
# point of keeping it next to the overlay that does deploy.
resources:
  - ../../base
  - karpenter
