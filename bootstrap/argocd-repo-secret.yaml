# Tells ArgoCD how to reach the local Gitea repository.
# Applied by setup.sh once both ArgoCD and Gitea are running.
#
# The URL is in-cluster service DNS rather than the ingress hostname, so repo
# sync does not depend on /etc/hosts or on the host network being reachable
# from inside a pod.
apiVersion: v1
kind: Secret
metadata:
  name: gitea-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: ${GITEA_INTERNAL_URL}
  username: ${GITEA_ADMIN_USER}
  password: ${GITEA_ADMIN_PASSWORD}
