# External Secrets Operator, pointed at the in-cluster AWS emulator (Moto
# Server, see manifests/aws-emulator.yaml) instead of real AWS.
# Placeholders below are substituted by render() from config.sh.
#
# The dummy credentials are what Moto expects; it validates the shape of a
# request, not the identity behind it.

installCRDs: true

# ESO's AWS provider does not honor the AWS SDK's newer AWS_ENDPOINT_URL /
# AWS_ENDPOINT_URL_<SERVICE> convention -- it reads its own older,
# per-service names (see https://external-secrets.io/latest/provider/aws-access/).
extraEnv: &localstackEnv
  - name: AWS_SECRETSMANAGER_ENDPOINT
    value: "${LOCALSTACK_INTERNAL_URL}"
  - name: AWS_SSM_ENDPOINT
    value: "${LOCALSTACK_INTERNAL_URL}"
  - name: AWS_STS_ENDPOINT
    value: "${LOCALSTACK_INTERNAL_URL}"
  - name: AWS_ACCESS_KEY_ID
    value: "test"
  - name: AWS_SECRET_ACCESS_KEY
    value: "test"
  - name: AWS_DEFAULT_REGION
    value: "${AWS_REGION}"

webhook:
  extraEnv: *localstackEnv

certController:
  extraEnv: *localstackEnv
